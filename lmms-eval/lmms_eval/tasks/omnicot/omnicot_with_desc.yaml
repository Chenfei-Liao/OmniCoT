include: _default_template.yaml
task: "omnicot_with_desc"

doc_to_text: !function utils.omnicot_doc_to_text_with_desc
doc_to_visual: !function utils.omnicot_doc_to_visual
doc_to_messages: !function utils.omnicot_doc_to_messages_with_desc

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "Answer the panoramic spatial reasoning question using the provided visual input and scene description. You MUST follow this exact format: <think>step-by-step reasoning</think><answer>final answer</answer>. The final answer should be concise: an object name, Yes/No, one of North/South/East/West/Northeast/Northwest/Southeast/Southwest, or an angle such as 90 degrees. If the answer cannot be determined, use <answer>Failed to Answer</answer>. Do not output anything outside the <think></think> and <answer></answer> tags."
    postfix_type: "cot"

metadata:
  - version: 1.0
  - description: "OmniCoT with scene description; visual input plus structured scene text plus question."

